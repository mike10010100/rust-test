name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gate:
    name: Rust Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview


      - name: Enable Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install CI Cargo Utilities
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny,cargo-audit,cargo-mutants

      - name: Enforce Code Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Dependency Policy Governance (cargo-deny)
        run: cargo deny check

      - name: Security Vulnerability Scan (cargo-audit)
        run: cargo audit

      - name: Run Test Suite (cargo-nextest)
        run: cargo nextest run --all-features

      - name: Generate Code Coverage (cargo-llvm-cov)
        run: cargo llvm-cov --all-features --workspace --fail-under-lines 95 --lcov --output-path lcov.info


      - name: Run Mutation Testing Smoke Test (cargo-mutants)
        run: |
          # Run a quick smoke test of cargo-mutants limited to 10 mutations
          # to keep CI speed high while verifying test effectiveness.
          cargo mutants --limit 10
