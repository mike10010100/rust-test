[package]
name = "rust-best-practices"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4"] }
futures-util = "0.3"
log = "0.4"

[dev-dependencies]
proptest = "1.4"

